<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SofaQuinta</title>
<meta name="apple-mobile-web-app-title" content="SofaQuinta">
<meta name="description" content="Gols, assistências e ranking do futebol de quinta.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0e1014; --surface:#171a21; --surface2:#1f232c; --line:#262b35;
  --text:#eef0f4; --muted:#8b93a3; --faint:#5d6574;
  --accent:#374df5; --accent-soft:rgba(55,77,245,.16); --accent-text:#aab4ff;
  --gold:#f5b400; --silver:#b8c0cc; --bronze:#d0894b;
  --danger:#ff5a5f; --ok:#1fc75a;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;background:var(--bg)}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;width:100%;
  overflow-x:hidden;overscroll-behavior-x:none;padding-bottom:env(safe-area-inset-bottom)}
html.lock, html.lock body{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button:disabled{cursor:default}
input{font:inherit;color:inherit}
img{max-width:100%}
.wrap{width:100%;max-width:720px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 0 max(16px,env(safe-area-inset-right))}

/* Header ------------------------------------------------------------ */
.top{position:sticky;top:0;z-index:20;background:rgba(14,16,20,.9);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.brand{display:flex;align-items:center;gap:12px;padding:14px 0 10px;min-width:0}
.brand > div:nth-child(2){min-width:0}
.logo{width:40px;height:40px;border-radius:12px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand h1{font-size:19px;font-weight:800;letter-spacing:.01em;white-space:nowrap}
.brand h1 span{color:#8b9aff}
.brand p{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{margin-left:auto;display:flex;align-items:center;gap:12px;flex:none}
.live{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:600}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(31,199,90,.18)}
.live.demo i{background:var(--gold);box-shadow:0 0 0 3px rgba(245,180,0,.18)}
.live.off i{background:var(--danger);box-shadow:0 0 0 3px rgba(255,90,95,.18)}
.mebtn{display:flex;align-items:center;gap:7px;height:36px;padding:0 12px 0 4px;border-radius:999px;background:var(--surface2);font-size:13px;font-weight:600;max-width:130px;transition:transform .12s var(--ease)}
.mebtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mebtn.out{padding:0 16px;background:var(--accent);color:#fff}
.mebtn:active{transform:scale(.96)}
.tabs{display:flex;gap:4px}
.tab{flex:1;padding:12px 0 13px;font-size:14px;font-weight:600;color:var(--muted);position:relative;transition:color .15s}
.tab.on{color:var(--text)}
.tab::after{content:"";position:absolute;left:18%;right:18%;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--accent);transform:scaleX(0);transition:transform .22s var(--ease)}
.tab.on::after{transform:scaleX(1)}

main{padding:16px 0 56px}
section[hidden]{display:none}
section.enter{animation:enter .22s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.card + .card,.craque + .card{margin-top:14px}
.label{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.press{transition:background .12s,transform .12s var(--ease)}
.press:active{transform:scale(.985)}

/* Leaders ----------------------------------------------------------- */
.leaders{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:10px}
.leader{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 12px;min-width:0;text-align:left}
.leader .label{font-size:10px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leader .who{display:flex;align-items:center;gap:8px;margin-top:10px;min-width:0}
.leader .name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leader .num{font-size:26px;font-weight:800;letter-spacing:-.03em;margin-top:8px;line-height:1}
.leader .num small{font-size:12px;font-weight:600;color:var(--muted);margin-left:3px;letter-spacing:0}

/* Craque da rodada -------------------------------------------------- */
.craque{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:14px;
  background:linear-gradient(90deg,rgba(245,180,0,.14),rgba(245,180,0,.03) 70%),var(--surface);border:1px solid rgba(245,180,0,.28)}
.craque[hidden]{display:none}
.craque .star{width:34px;height:34px;border-radius:10px;background:rgba(245,180,0,.16);display:grid;place-items:center;flex:none}
.craque .info{flex:1;min-width:0}
.craque .tag{font-size:10.5px;font-weight:800;letter-spacing:.07em;color:var(--gold)}
.craque .tag span{color:var(--muted);font-weight:600;letter-spacing:.02em;margin-left:6px;text-transform:none}
.craque .line{display:flex;align-items:center;gap:8px;margin-top:4px;min-width:0}
.craque .line b{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.craque .line small{font-size:12px;color:var(--muted);white-space:nowrap;flex:none}

/* Segmented --------------------------------------------------------- */
.seg{display:flex;gap:6px;padding:12px 12px 4px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{padding:8px 13px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);background:var(--surface2);white-space:nowrap;flex:none;transition:background .15s,color .15s}
.seg button.on{background:var(--accent-soft);color:var(--accent-text)}

/* Table ------------------------------------------------------------- */
.thead,.row{display:grid;grid-template-columns:26px minmax(0,1fr) 30px 30px 30px 38px 44px;align-items:center;gap:6px;padding:0 14px}
.thead{height:34px;font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.04em}
.thead span,.row .c{text-align:center}
.row{height:58px;border-top:1px solid var(--line);width:100%;text-align:left;transition:background .12s}
.row:active{background:var(--surface2)}
@media(hover:hover){.row:hover{background:var(--surface2)}}
.row.mine .pl b::after{content:"você";font-size:10px;font-weight:700;color:var(--accent-text);background:var(--accent-soft);padding:2px 5px;border-radius:4px;margin-left:6px;vertical-align:2px}
.pos{font-size:13px;font-weight:700;color:var(--muted);text-align:center}
.pos.p1{color:var(--gold)}.pos.p2{color:var(--silver)}.pos.p3{color:var(--bronze)}
.pl{display:flex;align-items:center;gap:10px;min-width:0}
.pl b{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .c{font-size:14px;font-weight:500;color:#c9ced8;font-variant-numeric:tabular-nums}
.hl{color:var(--text)!important;font-weight:800!important}
.thead .hl{color:var(--accent-text)!important}

.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;color:#fff}
img.av{object-fit:cover;background:var(--surface2)}
.av.lg{width:64px;height:64px;font-size:22px}
.av.sm{width:26px;height:26px;font-size:10.5px}

.rate{display:inline-grid;place-items:center;min-width:36px;height:24px;padding:0 6px;border-radius:6px;
  font-size:13px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.rate.none{background:var(--surface2);color:var(--faint)}

.foot{padding:12px 14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--faint);line-height:1.5}

/* Rounds ------------------------------------------------------------ */
.rhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 14px 12px}
.rhead > div:first-child{min-width:0}
.rhead h3{font-size:15px;font-weight:700}
.rhead p{font-size:12px;color:var(--muted);margin-top:3px}
.rtotal{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap;flex:none}
.rtotal b{display:block;font-size:20px;color:var(--text);font-weight:800;letter-spacing:-.02em}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);width:100%;text-align:left}
button.rrow:active{background:var(--surface2)}
.rrow .pl b{font-size:14px}
.chip{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip b{color:var(--text);font-weight:700}
.mvp{font-size:10px;font-weight:800;letter-spacing:.05em;color:var(--gold);background:rgba(245,180,0,.12);padding:3px 6px;border-radius:5px;flex:none}
.edit-tag{font-size:10px;font-weight:700;color:var(--accent-text);background:var(--accent-soft);padding:3px 6px;border-radius:5px;flex:none}
.absent{padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--faint)}

/* Form -------------------------------------------------------------- */
.fbody{padding:16px}
.field{margin-bottom:18px}
.field > .label{display:block;margin-bottom:10px}
/* 16px evita o zoom automático do iPhone ao tocar no campo */
.inp{display:block;width:100%;min-width:0;max-width:100%;height:48px;border-radius:12px;background:var(--surface2);border:1.5px solid transparent;
  padding:0 14px;font-size:16px;outline:none;color-scheme:dark;-webkit-appearance:none;appearance:none;transition:border-color .15s}
.inp:focus{border-color:var(--accent)}
input[type=date].inp{line-height:48px}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.steppers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stepper{background:var(--surface2);border-radius:14px;padding:12px;text-align:center;min-width:0}
.stepper .label{font-size:11px}
.stepper .ctl{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:4px}
.stepper button{width:46px;height:46px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:22px;font-weight:500;line-height:1;flex:none;transition:transform .08s,background .12s}
.stepper button:active:not(:disabled){transform:scale(.92);background:var(--line)}
.stepper button:disabled{opacity:.35}
.stepper output{font-size:36px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;min-width:0}
.stepper output.bump{animation:bump .18s var(--ease)}
@keyframes bump{50%{transform:scale(1.15)}}
.preview{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:12px;background:var(--surface2);margin-bottom:16px;font-size:13px;color:var(--muted)}
.notice{font-size:12.5px;color:var(--accent-text);background:var(--accent-soft);padding:10px 12px;border-radius:10px;margin-bottom:16px;line-height:1.45}
.notice[hidden]{display:none}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:14px;background:var(--accent);color:#fff;font-size:15px;font-weight:700;transition:opacity .15s,transform .12s var(--ease)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.45}
.btn.ghost{background:none;color:var(--danger);height:44px;font-size:13.5px;margin-top:6px}
.btn.ghost[hidden]{display:none}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ttl{font-size:20px;font-weight:800;letter-spacing:-.02em}
.sub{font-size:13px;color:var(--muted);margin:4px 0 20px;line-height:1.45}
.who-bar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--surface2);margin-bottom:18px}
.who-bar div{flex:1;min-width:0}
.who-bar small{display:block;font-size:11.5px;color:var(--muted)}
.who-bar b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link{font-size:13px;font-weight:600;color:var(--accent-text);padding:8px 4px}

/* Meus lançamentos ------------------------------------------------- */
.mylist .ch{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 10px}
.mylist .ch h3{font-size:15px;font-weight:700}
.mylist .ch small{font-size:12px;color:var(--muted);white-space:nowrap}
.mylist .ch h3{white-space:nowrap}
.sgrid .rate{font-size:14px;margin-top:2px}
.mine-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto auto;gap:12px;align-items:center;width:100%;text-align:left;
  padding:12px 14px;border-top:1px solid var(--line);font-size:13.5px;transition:background .15s}
.mine-row:active{background:var(--surface2)}
.mine-row.sel{background:var(--accent-soft)}
.mine-row .d{color:#c9ced8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mine-row .go{font-size:12px;font-weight:700;color:var(--accent-text)}

/* Modal ------------------------------------------------------------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0);display:flex;align-items:flex-end;justify-content:center;transition:background .22s}
.modal[hidden]{display:none}
.modal.show{background:rgba(0,0,0,.6)}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;max-height:88dvh;overflow:auto;overscroll-behavior:contain;
  border-radius:20px 20px 0 0;border:1px solid var(--line);border-bottom:0;padding-bottom:env(safe-area-inset-bottom);
  transform:translateY(100%);transition:transform .26s var(--ease)}
.modal.show .sheet{transform:none}
@media(min-width:640px){
  .modal{align-items:center;padding:24px}
  .sheet{border-radius:20px;border-bottom:1px solid var(--line);transform:translateY(24px) scale(.98);opacity:0;transition:transform .22s var(--ease),opacity .22s}
  .modal.show .sheet{transform:none;opacity:1}
}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:8px auto 0}
.shead{display:flex;align-items:center;gap:14px;padding:16px 56px 18px 18px;position:relative}
.shead > div{min-width:0}
.shead h2{font-size:20px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shead p{font-size:13px;color:var(--muted);margin-top:3px}
.close{position:absolute;top:12px;right:14px;width:36px;height:36px;border-radius:50%;background:var(--surface2);font-size:17px;color:var(--muted)}
.sgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sgrid div{padding:14px 4px;text-align:center}
.sgrid div + div{border-left:1px solid var(--line)}
.sgrid b{display:block;font-size:22px;font-weight:800;letter-spacing:-.02em}
.sgrid span{font-size:11px;color:var(--muted);font-weight:600}
.hist{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:12px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);font-size:13.5px;width:100%;text-align:left}
.hist.editable{grid-template-columns:minmax(0,1fr) auto auto auto auto}
.hist:first-of-type{border-top:0}
.hist .d{color:#c9ced8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist .go{font-size:12px;font-weight:700;color:var(--accent-text)}
button.hist:active{background:var(--surface2)}
.sactions{display:flex;gap:8px;padding:14px 18px 18px;border-top:1px solid var(--line)}
.sactions button{flex:1;min-width:0;height:44px;border-radius:12px;background:var(--surface2);font-size:13.5px;font-weight:600;white-space:nowrap}
.sactions button:active{background:var(--line)}
.sactions .danger{color:var(--danger)}
.avwrap{position:relative;flex:none;border-radius:50%}
.avwrap .cam{position:absolute;right:-2px;bottom:-2px;width:24px;height:24px;border-radius:50%;background:var(--accent);display:grid;place-items:center;border:2px solid var(--surface)}
.cbody{padding:22px 18px 18px;text-align:center}
.cbody h3{font-size:17px;font-weight:800}
.cbody p{font-size:13.5px;color:var(--muted);margin-top:6px;line-height:1.45}
.cbtns{display:flex;gap:8px;margin-top:20px}
.cbtns button{flex:1;height:48px;border-radius:12px;font-weight:700;font-size:14.5px;background:var(--surface2)}
.cbtns .red{background:var(--danger);color:#fff}

.empty{padding:36px 20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.skel{height:58px;border-top:1px solid var(--line);background:linear-gradient(90deg,transparent,rgba(255,255,255,.03),transparent);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,16px);opacity:0;pointer-events:none;
  max-width:calc(100% - 32px);width:max-content;text-align:center;
  background:#fff;color:#111;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;transition:opacity .22s,transform .22s var(--ease);z-index:70;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--danger);color:#fff}

@media(max-width:420px){
  .thead,.row{grid-template-columns:22px minmax(0,1fr) 24px 24px 24px 32px 40px;gap:4px;padding:0 10px}
  .row .pl{gap:8px}
  .leader{padding:12px 10px}
  .leader .num{font-size:22px}
  .live span{display:none}
  .brand{gap:10px}
  .mine-row,.hist.editable{gap:9px}
}
@media(max-width:370px){
  .stepper{padding:10px 8px}
  .stepper button{width:40px;height:40px;font-size:20px}
  .stepper output{font-size:30px}
  .fbody{padding:14px}
}
@media(max-width:350px){
  .brand h1{font-size:17px}
  .logo{width:34px;height:34px}
  .row .pl .av{display:none}
}

/* Compartilhar ------------------------------------------------------ */
.sharebtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;border-top:1px solid var(--line);font-size:13.5px;font-weight:700;color:var(--accent-text);transition:background .12s}
.sharebtn:active{background:var(--surface2)}
.shbody{padding:0 18px 18px}
.shseg{padding:0 0 12px}
.shprev{border-radius:14px;background:repeating-conic-gradient(#171a21 0 25%,#1c2029 0 50%) 0 0/20px 20px;padding:10px;min-height:120px;display:grid;place-items:center}
.shprev img{display:block;width:100%;aspect-ratio:1600/800;border-radius:10px;transition:opacity .2s;background:transparent}
.shbtns{display:grid;gap:8px;margin-top:14px}
.btn.alt{background:var(--surface2);color:var(--text)}
.shprev.clear{background:linear-gradient(135deg,#3a6b8f,#c7743f 55%,#2d3b2a)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">

<script>
/* ======================================================================
   CONFIGURAÇÃO — dados do projeto Supabase (Project Settings → API).
   Deixando vazio, o app roda em modo demo, salvando só neste navegador.
   ====================================================================== */
const CONFIG = {
  SUPABASE_URL: 'https://ndezkrycxvzbdrbnzjix.supabase.co',
  SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kZXprcnljeHZ6YmRyYm56aml4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNzA5OTIsImV4cCI6MjEwNTg0Njk5Mn0.LTqxNcSOd6z7yOrvgTMDXJVmUYb4dSdAFcaRQHQSWZE'
};

const DEMO = !CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY;
const sb = DEMO || !window.supabase ? null : window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
const need = () => { if (!sb) throw new Error('Failed to fetch'); };

const DEMO_PLAYERS = [
  { id: 1, name: 'Pedro C.', username: 'pedro' }, { id: 2, name: 'Davi A.', username: 'davi' },
  { id: 3, name: 'João Siqueira', username: 'joao' }, { id: 4, name: 'David T.', username: 'david' },
  { id: 5, name: 'Alexandre', username: 'alexandre' }
];
const DEMO_PASS = '123';
const COLORS = ['#374df5', '#e2466c', '#0fa37f', '#e8871e', '#8b5cf6', '#0ea5e9', '#d946ef', '#65a30d'];
const HEIC_LIB = 'https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';
const TABS = ['ranking', 'rodadas', 'lancar'];
const MAX = 30;

const state = { players: [], stats: [], mode: 'geral', tab: 'ranking', loaded: false, modalId: null };
const form = { date: '', goals: 0, assists: 0 };
let busy = false;

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const parseDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const validDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(parseDate(s));
const lastThursday = () => { const d = new Date(); d.setDate(d.getDate() - ((d.getDay() - 4 + 7) % 7)); return iso(d); };
const fmtDate = (s, opts) => { const t = parseDate(s).toLocaleDateString('pt-BR', opts || { weekday: 'short', day: '2-digit', month: 'short' }).replace(/\./g, ''); return t.charAt(0).toUpperCase() + t.slice(1); };
const fmtLong = s => fmtDate(s, { weekday: 'long', day: '2-digit', month: 'long' });
const fmtShort = s => fmtDate(s, { day: '2-digit', month: 'short' });
const initials = n => n.replace(/\./g, '').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
const safePhoto = u => typeof u === 'string' && /^data:image\/(jpeg|png|webp);base64,[a-z0-9+/=]+$/i.test(u);
const avatar = (p, cls = '') => safePhoto(p.photo)
  ? `<img class="av ${cls}" src="${p.photo}" alt="" draggable="false">`
  : `<span class="av ${cls}" style="background:${COLORS[(p.id - 1) % COLORS.length]}">${esc(initials(p.name))}</span>`;
const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;
const norm = s => String(s).trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const first = n => n.split(' ')[0];
const nextFrame = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

const nota = (g, a) => Math.min(10, 6.5 + g * 0.9 + a * 0.6);
const rateColor = r => r >= 9 ? '#374df5' : r >= 8 ? '#00adc4' : r >= 7 ? '#00c424' : r >= 6.5 ? '#c9a100' : r >= 6 ? '#ed7e07' : '#dc0c00';
const badge = r => r == null ? '<span class="rate none">–</span>' : `<span class="rate" style="background:${rateColor(r)}">${r.toFixed(1).replace('.', ',')}</span>`;
const STAR = '<svg width="18" height="18" viewBox="0 0 24 24" fill="#f5b400"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z"/></svg>';

function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = 'toast' + (err ? ' err' : ''), err ? 3200 : 2200);
}
function friendly(e) {
  const m = String((e && e.message) || e);
  if (/Usuário ou senha/i.test(m)) return 'Usuário ou senha incorretos';
  if (/senha|PIN/i.test(m)) return 'Sessão expirada, entre de novo';
  if (/futuro/i.test(m)) return 'Essa data ainda não chegou';
  if (/Failed to fetch|NetworkError|Load failed|network/i.test(m)) return 'Sem conexão. Tente de novo.';
  if (/Foto/i.test(m)) return m;
  return 'Algo deu errado: ' + m;
}

/* ---------- sessão ---------- */
let session = null;
try { session = JSON.parse(store.get('sofaquinta-session') || 'null'); } catch {}
const me = () => session && state.players.find(p => p.id === session.id);

/* ---------- dados ---------- */
const demoPhotos = () => { try { return JSON.parse(store.get('sofaquinta-demo-photos') || '{}'); } catch { return {}; } };
const demoStats = () => { try { return JSON.parse(store.get('sofaquinta-demo') || '[]'); } catch { return []; } };
const api = {
  async load() {
    if (!DEMO) need();
    if (DEMO) {
      const ph = demoPhotos();
      return { players: DEMO_PLAYERS.map(p => ({ ...p, photo: ph[p.id] || null })), stats: demoStats() };
    }
    const [p, s] = await Promise.all([
      sb.from('players').select('id,name,username,photo').order('id'),
      sb.from('stats').select('player_id,match_date,goals,assists').order('match_date', { ascending: false })
    ]);
    if (p.error) throw p.error;
    if (s.error) throw s.error;
    return { players: p.data, stats: s.data };
  },
  async login(user, pass) {
    if (!DEMO) need();
    if (DEMO) {
      const p = DEMO_PLAYERS.find(x => x.username === norm(user));
      if (!p || pass !== DEMO_PASS) throw new Error('Usuário ou senha incorretos');
      return { id: p.id, name: p.name };
    }
    const { data, error } = await sb.rpc('entrar', { p_usuario: norm(user), p_senha: pass });
    if (error) throw new Error(error.message);
    const row = Array.isArray(data) ? data[0] : data;
    if (!row) throw new Error('Usuário ou senha incorretos');
    return { id: row.player_id, name: row.player_name };
  },
  async save(match_date, goals, assists) {
    if (!DEMO) need();
    if (DEMO) {
      const stats = demoStats().filter(s => !(s.player_id === session.id && s.match_date === match_date));
      stats.push({ player_id: session.id, match_date, goals, assists });
      store.set('sofaquinta-demo', JSON.stringify(stats));
      return;
    }
    const { error } = await sb.rpc('lancar_rodada', { p_player_id: session.id, p_date: match_date, p_goals: goals, p_assists: assists, p_pin: session.pass });
    if (error) throw new Error(error.message);
  },
  async remove(match_date) {
    if (!DEMO) need();
    if (DEMO) {
      store.set('sofaquinta-demo', JSON.stringify(demoStats().filter(s => !(s.player_id === session.id && s.match_date === match_date))));
      return;
    }
    const { error } = await sb.rpc('apagar_rodada', { p_player_id: session.id, p_date: match_date, p_pin: session.pass });
    if (error) throw new Error(error.message);
  },
  async setPhoto(dataUrl) {
    if (!DEMO) need();
    if (DEMO) {
      const ph = demoPhotos();
      if (dataUrl) ph[session.id] = dataUrl; else delete ph[session.id];
      store.set('sofaquinta-demo-photos', JSON.stringify(ph));
      return;
    }
    const { error } = await sb.rpc('atualizar_foto', { p_player_id: session.id, p_pin: session.pass, p_foto: dataUrl });
    if (error) throw new Error(error.message);
  }
};

let loadSeq = 0;
async function reload() {
  const my = ++loadSeq;
  try {
    const data = await api.load();
    if (my !== loadSeq) return;               // resposta antiga: ignora
    state.players = data.players;
    state.stats = data.stats.map(s => ({ ...s, goals: +s.goals, assists: +s.assists }));
    const firstLoad = !state.loaded;
    state.loaded = true;
    setLive(true);
    if (firstLoad) syncFromExisting();
    render();
    if (state.modalId) renderPlayer(state.modalId);
  } catch (e) {
    if (my !== loadSeq) return;
    console.error(e);
    setLive(false);
    if (!state.loaded) {
      $('#summary').textContent = 'Erro ao carregar';
      $('#table').innerHTML = `<div class="empty"><b>Não consegui carregar os dados</b>${esc(friendly(e))}<br><button class="link" data-retry>Tentar de novo</button></div>`;
    } else toast(friendly(e), true);
  }
}
function setLive(ok) {
  const l = $('#live');
  if (DEMO) { l.className = 'live demo'; l.querySelector('span').textContent = 'Modo demo'; return; }
  l.className = 'live' + (ok ? '' : ' off');
  l.querySelector('span').textContent = ok ? 'Ao vivo' : 'Offline';
}
document.addEventListener('click', ev => { if (ev.target.closest('[data-retry]')) { $('#table').innerHTML = '<div class="skel"></div><div class="skel"></div>'; reload(); } });

/* ---------- cálculos ---------- */
function aggregate() {
  const map = new Map(state.players.map(p => [p.id, { ...p, j: 0, g: 0, a: 0, sum: 0 }]));
  for (const s of state.stats) {
    const m = map.get(s.player_id); if (!m) continue;
    m.j++; m.g += s.goals; m.a += s.assists; m.sum += nota(s.goals, s.assists);
  }
  return [...map.values()].map(m => ({ ...m, ga: m.g + m.a, media: m.j ? m.sum / m.j : null }));
}
const SORT = {
  geral: (a, b) => b.ga - a.ga || b.g - a.g || (b.media || 0) - (a.media || 0) || a.name.localeCompare(b.name),
  gols: (a, b) => b.g - a.g || a.j - b.j || a.name.localeCompare(b.name),
  assist: (a, b) => b.a - a.a || a.j - b.j || a.name.localeCompare(b.name)
};
const TIEKEY = {
  geral: r => `${r.ga}|${r.g}|${(r.media || 0).toFixed(2)}`,
  gols: r => `${r.g}|${r.j}`,
  assist: r => `${r.a}|${r.j}`
};
const dates = () => [...new Set(state.stats.map(s => s.match_date))].sort().reverse();
function roundLines(d) {
  const byId = new Map(state.players.map(p => [p.id, p]));
  return state.stats.filter(s => s.match_date === d)
    .map(s => ({ ...s, r: nota(s.goals, s.assists), p: byId.get(s.player_id) }))
    .filter(s => s.p)
    .sort((a, b) => b.r - a.r || b.goals - a.goals || a.p.name.localeCompare(b.p.name));
}
function craques(lines) {
  const top = lines[0];
  if (!top || top.goals + top.assists === 0) return [];
  return lines.filter(l => l.r === top.r && l.goals === top.goals);
}

/* ---------- render ---------- */
function render() {
  const rows = aggregate();
  const ds = dates();
  const totalG = rows.reduce((t, r) => t + r.g, 0);
  $('#summary').textContent = ds.length ? `${plural(ds.length, 'rodada', 'rodadas')} · ${plural(totalG, 'gol', 'gols')}` : 'Futebol de quinta · nenhuma rodada ainda';
  renderMe();
  renderLeaders(rows);
  renderCraque(ds);
  renderTable(rows);
  renderRounds(ds);
  renderForm();
  renderMyList();
}

function renderMe() {
  const p = me(), b = $('#mebtn');
  b.className = 'mebtn' + (p ? '' : ' out');
  b.innerHTML = p ? `${avatar(p, 'sm')}<span>${esc(first(p.name))}</span>` : 'Entrar';
  b.setAttribute('aria-label', p ? 'Meu perfil' : 'Entrar');
}

function renderLeaders(rows) {
  const best = (key, filter = () => true) => rows.filter(filter).sort((a, b) => (b[key] || 0) - (a[key] || 0) || a.j - b.j || a.name.localeCompare(b.name))[0];
  const card = (label, p, val, unit) => p && val
    ? `<button class="leader press" data-player="${p.id}"><div class="label">${label}</div><div class="num">${val}<small>${unit}</small></div><div class="who">${avatar(p, 'sm')}<span class="name">${esc(p.name)}</span></div></button>`
    : `<div class="leader"><div class="label">${label}</div><div class="num" style="color:var(--faint)">–</div><div class="who"><span class="name" style="color:var(--faint)">Sem dados</span></div></div>`;
  const g = best('g'), a = best('a'), m = best('media', r => r.j > 0);
  $('#leaders').innerHTML =
    card('Artilheiro', g, g && g.g, g && g.g === 1 ? 'gol' : 'gols') +
    card('Garçom', a, a && a.a, a && a.a === 1 ? 'assist.' : 'assists.') +
    card('Melhor nota', m, m && m.media ? m.media.toFixed(1).replace('.', ',') : 0, '');
}

function renderCraque(ds) {
  const el = $('#craque');
  const d = ds[0];
  const list = d ? craques(roundLines(d)) : [];
  if (!list.length) { el.hidden = true; return; }
  const c = list[0];
  const names = list.map(l => esc(list.length > 1 ? first(l.p.name) : l.p.name)).join(' e ');
  el.hidden = false;
  el.dataset.player = c.player_id;
  el.innerHTML = `
    <span class="star">${STAR}</span>
    <span class="info">
      <span class="tag">CRAQUE DA RODADA<span>${fmtShort(d)}</span></span>

/* ---------- foto ---------- */
function loadScript(src) {
  return new Promise((ok, fail) => {
    if (document.querySelector(`script[src="${src}"]`)) return ok();
    const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = fail; document.head.appendChild(s);
  });
}
function loadImg(blob) {
  return new Promise((ok, fail) => {
    const url = URL.createObjectURL(blob), img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); ok(img); };
    img.onerror = () => { URL.revokeObjectURL(url); fail(new Error('decode')); };
    img.src = url;
  });
}
async function decode(blob) {
  try { return await createImageBitmap(blob); } catch {}
  try { return await loadImg(blob); } catch {}
  return null;
}
async function toAvatar(file) {
  let src = await decode(file);
  if (!src && /heic|heif/i.test(file.type + file.name)) {
    await loadScript(HEIC_LIB);
    const out = await window.heic2any({ blob: file, toType: 'image/jpeg', quality: 0.9 });
    src = await decode(Array.isArray(out) ? out[0] : out);
  }
  if (!src) throw new Error('Foto: não consegui abrir esse arquivo. Tente uma imagem (JPG, PNG, HEIC, WEBP…).');
  const w = src.width, h = src.height, side = Math.min(w, h), SIZE = 320;
  const c = document.createElement('canvas'); c.width = c.height = SIZE;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#1f232c'; ctx.fillRect(0, 0, SIZE, SIZE);
  ctx.drawImage(src, (w - side) / 2, (h - side) / 2, side, side, 0, 0, SIZE, SIZE);
  return c.toDataURL('image/jpeg', 0.82);
}
document.addEventListener('click', ev => { if (ev.target.closest('[data-photo]') && !busy) $('#file').click(); });

  const file = ev.target.files[0]; ev.target.value = '';
  if (!file || !session || busy) return;

  try {
    const url = await toAvatar(file);
    await api.setPhoto(url);
    await reload();

  } catch (e) { console.error(e); if (!sessionExpired(e)) toast(friendly(e), true); }
  busy = false; renderForm();
});

/* ---------- navegação (abas + voltar do celular) ---------- */
const scrollPos = {};
function parseHash() {
  const [t, p] = location.hash.replace(/^#/, '').split('/');
  const tab = TABS.includes(t) ? t : 'ranking';
  const pid = p && /^p\d+$/.test(p) ? +p.slice(1) : null;
  return { tab, pid };
}
function go(tab, pid, replace) {
  const hash = '#' + tab + (pid ? '/p' + pid : '');
  if (hash !== location.hash) history[replace ? 'replaceState' : 'pushState']({ app: 1 }, '', hash);
  applyRoute();
}
function applyRoute() {
  const { tab, pid } = parseHash();
  if (tab !== state.tab) showTab(tab);
  if (pid && state.loaded && state.players.some(p => p.id === pid)) showPlayer(pid);
  else if (!pid && state.modalId) hidePlayer();
}
function showTab(t) {
  scrollPos[state.tab] = window.scrollY;
  state.tab = t;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  document.querySelectorAll('main > section').forEach(s => {
    const on = s.id === 'tab-' + t;
    s.hidden = !on;
    s.classList.remove('enter');
    if (on) { void s.offsetWidth; s.classList.add('enter'); }
  });
  window.scrollTo(0, scrollPos[t] || 0);
}
window.addEventListener('popstate', applyRoute);
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
  if (b.dataset.tab === state.tab) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  go(b.dataset.tab);
}));
$('#seg').addEventListener('click', ev => {
  const b = ev.target.closest('[data-mode]'); if (!b || b.dataset.mode === state.mode) return;
  state.mode = b.dataset.mode;
  $('#seg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  renderTable(aggregate());
});

function lockScroll(on) { document.documentElement.classList.toggle('lock', on); }
async function animateIn(m) { m.hidden = false; await nextFrame(); m.classList.add('show'); }
function animateOut(m) {
  return new Promise(res => {
    m.classList.remove('show');
    const done = () => { m.hidden = true; res(); };
    const sh = m.querySelector('.sheet');
    let fired = false;
    sh.addEventListener('transitionend', function te(e) { if (e.target !== sh || fired) return; fired = true; sh.removeEventListener('transitionend', te); done(); });
    setTimeout(() => { if (!fired) { fired = true; done(); } }, 320);

}

(function swipe() {
  const sh = $('#sheet'); let y0 = null, dy = 0;
  sh.addEventListener('touchstart', e => { y0 = sh.scrollTop <= 0 ? e.touches[0].clientY : null; dy = 0; }, { passive: true });

/* ---------- confirmação ---------- */
function ask(title, text, okLabel) {
  return new Promise(res => {
    const m = $('#confirm');
    $('#csheet').innerHTML = `<div class="cbody"><h3>${esc(title)}</h3><p>${esc(text)}</p>
      <div class="cbtns"><button data-c="0">Cancelar</button><button class="red" data-c="1">${esc(okLabel)}</button></div></div>`;
    lockScroll(true);
    animateIn(m);
    const finish = v => {
      m.removeEventListener('click', onClick);
      document.removeEventListener('keydown', onKey);
      animateOut(m).then(() => { if (!state.modalId) lockScroll(false); });
      res(v);
    };
    const onClick = ev => {
      const b = ev.target.closest('[data-c]');
      if (b) finish(b.dataset.c === '1'); else if (ev.target === m) finish(false);
    };
    const onKey = ev => { if (ev.key === 'Escape') finish(false); };
    m.addEventListener('click', onClick);
    document.addEventListener('keydown', onKey);
  });
}

const CARD_W = 1600, CARD_H = 800, CARD_R = 56, M = 64, LW = 5;   // LW = espessura única de todas as linhas
const BALL_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 70 372 372"><defs><clipPath id="sbc"><circle cx="256" cy="256" r="178"/></clipPath><radialGradient id="ssh" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#fff"/><stop offset=".75" stop-color="#f1f3f8"/><stop offset="1" stop-color="#d5dae6"/></radialGradient></defs><circle cx="256" cy="256" r="178" fill="url(#ssh)"/><g clip-path="url(#sbc)"><polygon points="256.0,204.0 305.5,239.9 286.6,298.1 225.4,298.1 206.5,239.9" fill="#141821" stroke="#141821" stroke-width="5" stroke-linejoin="round"/><polygon points="256.0,145.9 206.5,110.0 225.4,51.9 286.6,51.9 305.5,110.0" fill="#141821" stroke="#141821" stroke-width="5" stroke-linejoin="round"/><line x1="256.0" y1="204.0" x2="256.0" y2="145.9" stroke="#141821" stroke-width="9" stroke-linecap="round"/><polygon points="360.7,222.0 379.6,163.8 440.7,163.8 459.6,222.0 410.1,257.9" fill="#141821" stroke="#141821" stroke-width="5" stroke-linejoin="round"/><line x1="305.5" y1="239.9" x2="360.7" y2="222.0" stroke="#141821" stroke-width="9" stroke-linecap="round"/><polygon points="320.7,345.1 381.8,345.1 400.7,403.2 351.3,439.1 301.8,403.2" fill="#141821" stroke="#141821" stroke-width="5" stroke-linejoin="round"/><line x1="286.6" y1="298.1" x2="320.7" y2="345.1" stroke="#141821" stroke-width="9" stroke-linecap="round"/><polygon points="191.3,345.1 210.2,403.2 160.7,439.1 111.3,403.2 130.2,345.1" fill="#141821" stroke="#141821" stroke-width="5" stroke-linejoin="round"/><line x1="225.4" y1="298.1" x2="191.3" y2="345.1" stroke="#141821" stroke-width="9" stroke-linecap="round"/><polygon points="151.3,222.0 101.9,257.9 52.4,222.0 71.3,163.8 132.4,163.8" fill="#141821" stroke="#141821" stroke-width="5" stroke-linejoin="round"/><line x1="206.5" y1="239.9" x2="151.3" y2="222.0" stroke="#141821" stroke-width="9" stroke-linecap="round"/><line x1="305.5" y1="110.0" x2="366.4" y2="104.0" stroke="#141821" stroke-width="9" stroke-linecap="round"/><line x1="379.6" y1="163.8" x2="366.4" y2="104.0" stroke="#141821" stroke-width="9" stroke-linecap="round"/><line x1="366.4" y1="104.0" x2="371.1" y2="97.6" stroke="#141821" stroke-width="9" stroke-linecap="round"/><line x1="410.1" y1="257.9" x2="434.6" y2="314.0" stroke="#141821" stroke-width="9" stroke-linecap="round"/><line x1="381.8" y1="345.1" x2="434.6" y2="314.0" stroke="#141821" stroke-width="9" stroke-linecap="round"/><line x1="434.6" y1="314.0" x2="442.2" y2="316.5" stroke="#141821" stroke-width="9" stroke-linecap="round"/><line x1="301.8" y1="403.2" x2="256.0" y2="443.8" stroke="#141821" stroke-width="9" stroke-linecap="round"/><line x1="210.2" y1="403.2" x2="256.0" y2="443.8" stroke="#141821" stroke-width="9" stroke-linecap="round"/><line x1="256.0" y1="443.8" x2="256.0" y2="451.8" stroke="#141821" stroke-width="9" stroke-linecap="round"/><line x1="130.2" y1="345.1" x2="77.4" y2="314.0" stroke="#141821" stroke-width="9" stroke-linecap="round"/><line x1="101.9" y1="257.9" x2="77.4" y2="314.0" stroke="#141821" stroke-width="9" stroke-linecap="round"/><line x1="77.4" y1="314.0" x2="69.8" y2="316.5" stroke="#141821" stroke-width="9" stroke-linecap="round"/><line x1="132.4" y1="163.8" x2="145.6" y2="104.0" stroke="#141821" stroke-width="9" stroke-linecap="round"/><line x1="206.5" y1="110.0" x2="145.6" y2="104.0" stroke="#141821" stroke-width="9" stroke-linecap="round"/><line x1="145.6" y1="104.0" x2="140.9" y2="97.6" stroke="#141821" stroke-width="9" stroke-linecap="round"/></g></svg>`;
let ballImg = null;
const THEMES = {
  dark:  { clear: false, text: '#fff', soft: '#c9ced8', muted: '#8b93a3', faint: '#6b7384', line: 'rgba(255,255,255,.10)', stroke: 'rgba(255,255,255,.14)', accent: '#aab4ff', brand2: '#8b9aff' },
  clear: { clear: true,  text: '#fff', soft: '#fff', muted: 'rgba(255,255,255,.88)', faint: 'rgba(255,255,255,.82)', line: 'rgba(255,255,255,.9)', stroke: '#fff', accent: '#fff', brand2: '#fff' }
};
let T = THEMES.dark;

function loadImage(src) {
  return new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(i); i.onerror = fail; i.src = src; });
}
async function getBall() {
  if (!ballImg) ballImg = await loadImage('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(BALL_SVG)).catch(() => null);
  return ballImg;
}
function rr(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function font(size, weight = 700) { return `${weight} ${size}px Inter, system-ui, -apple-system, sans-serif`; }
function fit(ctx, text, maxW, size, weight = 800, min = 18) {
  let s = size;
  ctx.font = font(s, weight);
  while (ctx.measureText(text).width > maxW && s > min) { s -= 2; ctx.font = font(s, weight); }
  if (ctx.measureText(text).width > maxW) {
    let t = text;
    while (t.length > 1 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
    return t + '…';
  }
  return text;
}
function spaced(ctx, px) { if ('letterSpacing' in ctx) ctx.letterSpacing = px + 'px'; }
function strokeNow(ctx) { ctx.lineWidth = LW; ctx.strokeStyle = T.stroke; ctx.stroke(); }
function hline(ctx, x, y, w) { ctx.fillStyle = T.line; ctx.fillRect(x, y - LW / 2, w, LW); }
function text(ctx, s, x, y, size, weight, color, align = 'left', base = 'middle', ls = 0) {
  ctx.font = font(size, weight); ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base; spaced(ctx, ls);
  ctx.fillText(s, x, y); spaced(ctx, 0);
}
// avatar com contorno na mesma espessura
async function drawAvatar(ctx, p, cx, cy, d, ringColor) {
  const x = cx - d / 2, y = cy - d / 2;
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, d / 2, 0, Math.PI * 2); ctx.closePath(); ctx.clip();
  let img = null;
  if (safePhoto(p.photo)) img = await loadImage(p.photo).catch(() => null);
  if (img) ctx.drawImage(img, x, y, d, d);
  else {
    ctx.fillStyle = T.clear ? 'rgba(255,255,255,.12)' : COLORS[(p.id - 1) % COLORS.length]; ctx.fillRect(x, y, d, d);
    text(ctx, initials(p.name), cx, cy + d * 0.02, Math.round(d * 0.36), 800, '#fff', 'center');
  }
  ctx.restore();
  ctx.beginPath(); ctx.arc(cx, cy, d / 2 - LW / 2, 0, Math.PI * 2);
  ctx.lineWidth = LW; ctx.strokeStyle = T.clear ? '#fff' : (ringColor || 'rgba(255,255,255,.18)'); ctx.stroke();
}
function panel(ctx, x, y, w, h, r, fill) {
  rr(ctx, x + LW / 2, y + LW / 2, w - LW, h - LW, r);
  if (!T.clear && fill) { ctx.fillStyle = fill; ctx.fill(); }
  strokeNow(ctx);
}
// caixa da nota com largura fixa, centrada em cx
function drawRate(ctx, r, cx, cy, w, h, fs) {
  const txt = r.toFixed(1).replace('.', ',');
  rr(ctx, cx - w / 2 + LW / 2, cy - h / 2 + LW / 2, w - LW, h - LW, h * 0.24);
  if (T.clear) { ctx.lineWidth = LW; ctx.strokeStyle = '#fff'; ctx.stroke(); }
  else { ctx.fillStyle = rateColor(r); ctx.fill(); }
  text(ctx, txt, cx, cy + fs * 0.04, fs, 800, '#fff', 'center');
}
async function cardBase(ctx, rightTop, rightBottom) {
  ctx.clearRect(0, 0, CARD_W, CARD_H);
  const ball = await getBall();
  ctx.save();
  if (T.clear) {
    ctx.shadowColor = 'rgba(0,0,0,.28)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 2;
    rr(ctx, LW / 2, LW / 2, CARD_W - LW, CARD_H - LW, CARD_R); ctx.lineWidth = LW; ctx.strokeStyle = '#fff'; ctx.stroke();
  } else {
    rr(ctx, 0, 0, CARD_W, CARD_H, CARD_R); ctx.clip();
    const bg = ctx.createLinearGradient(0, 0, CARD_W, CARD_H);
    bg.addColorStop(0, '#151a2b'); bg.addColorStop(.55, '#0f1218'); bg.addColorStop(1, '#0b0d12');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, CARD_W, CARD_H);
    const glow = ctx.createRadialGradient(240, 100, 0, 240, 100, 800);
    glow.addColorStop(0, 'rgba(55,77,245,.42)'); glow.addColorStop(1, 'rgba(55,77,245,0)');
    ctx.fillStyle = glow; ctx.fillRect(0, 0, CARD_W, CARD_H);
    if (ball) { ctx.globalAlpha = .045; ctx.drawImage(ball, CARD_W - 470, CARD_H - 420, 640, 640); ctx.globalAlpha = 1; }
    rr(ctx, M, 44, 64, 64, 17); ctx.fillStyle = '#374df5'; ctx.fill();
  }
  // cabeçalho: logo, marca e rodada alinhados na mesma linha (y = 76)
  const hy = 76;
  if (ball) T.clear ? ctx.drawImage(ball, M, hy - 32, 64, 64) : ctx.drawImage(ball, M + 7, hy - 25, 50, 50);
  ctx.font = font(40, 800); spaced(ctx, 1);
  const w = ctx.measureText('SOFA').width;
  text(ctx, 'SOFA', M + 86, hy + 2, 40, 800, T.text, 'left', 'middle', 1);
  text(ctx, 'QUINTA', M + 86 + w + 1, hy + 2, 40, 800, T.brand2, 'left', 'middle', 1);
  ctx.font = font(26, 800); spaced(ctx, 3);
  const rt = rightTop.toUpperCase(), rtw = ctx.measureText(rt).width;
  spaced(ctx, 0);
  text(ctx, rt, CARD_W - M, hy + 1, 26, 800, T.accent, 'right', 'middle', 3);
  text(ctx, rightBottom, CARD_W - M - rtw - 26, hy + 1, 26, 500, T.muted, 'right');
  ctx.fillStyle = T.muted; ctx.beginPath(); ctx.arc(CARD_W - M - rtw - 13, hy + 1, 3.5, 0, Math.PI * 2); ctx.fill();
}
function cardFooter(ctx, left) {
  const fy = CARD_H - 58;
  hline(ctx, M, CARD_H - 112, CARD_W - 2 * M);
  text(ctx, left, M, fy, 28, 600, T.soft);
  text(ctx, (location.host && !/^(localhost|127\.)/.test(location.host)) ? location.host : 'sofaquinta', CARD_W - M, fy, 26, 600, T.faint, 'right');
  ctx.restore();
}
function roundInfo(d) {
  const ds = dates();
  return { n: ds.length - ds.indexOf(d), lines: roundLines(d) };
}
// área útil entre cabeçalho e rodapé
const TOP = 138, BOT = CARD_H - 140;

async function drawRoundCard(ctx, d) {
  const { n, lines } = roundInfo(d);
  await cardBase(ctx, `Rodada ${n}`, fmtLong(d));
  const tops = craques(lines), top = tops[0] || lines[0];
  // destaque (maior nota) — mesma altura da lista
  const px = M, py = TOP, pw = 470, ph = BOT - TOP;
  const pg = ctx.createLinearGradient(px, py, px, py + ph);
  pg.addColorStop(0, 'rgba(55,77,245,.22)'); pg.addColorStop(1, 'rgba(55,77,245,.04)');
  panel(ctx, px, py, pw, ph, 36, pg);
  const cx = px + pw / 2;
  if (top) {
    const D = 176;
    const o = (ph - 420) / 2;   // centraliza o bloco no painel
    await drawAvatar(ctx, top.p, cx, py + o + D / 2, D, 'rgba(139,154,255,.9)');
    const nm = tops.length > 1 ? tops.map(t => first(t.p.name)).join(' e ') : top.p.name;
    ctx.font = font(46, 800);
    text(ctx, fit(ctx, nm, pw - 60, 46, 800, 28), cx, py + o + 234, ctx.font.match(/(\d+)px/)[1] * 1, 800, T.text, 'center');
    text(ctx, `${plural(top.goals, 'gol', 'gols')} · ${plural(top.assists, 'assist.', 'assist.')}`, cx, py + o + 284, 30, 700, T.soft, 'center');
    drawRate(ctx, top.r, cx, py + o + 377, 176, 86, 60);
  }
  // lista: colunas com centro fixo, cabeçalho e valores na mesma vertical
  const lx = px + pw + 56, rx = CARD_W - M, lw = rx - lx;
  const colN = rx - 70, colA = rx - 210, colG = rx - 320;
  const hy = TOP + 18;
  text(ctx, 'JOGADOR', lx, hy, 22, 800, T.muted, 'left', 'middle', 3);
  text(ctx, 'G', colG, hy, 22, 800, T.muted, 'center', 'middle', 3);
  text(ctx, 'A', colA, hy, 22, 800, T.muted, 'center', 'middle', 3);
  text(ctx, 'NOTA', colN, hy, 22, 800, T.muted, 'center', 'middle', 3);
  const y0 = TOP + 44, avail = BOT - y0;
  const rows = lines.slice(0, 6), rh = Math.min(avail / 5, avail / Math.max(rows.length, 1));
  const ad = Math.min(64, rh - 22), vs = Math.min(50, rh * 0.52);
  for (let i = 0; i < rows.length; i++) {
    const l = rows[i], y = y0 + i * rh, mid = y + rh / 2;
    hline(ctx, lx, y, lw);
    text(ctx, String(i + 1), lx + 14, mid, 28, 800, T.clear ? '#fff' : i === 0 ? '#f5b400' : i === 1 ? '#b8c0cc' : i === 2 ? '#d0894b' : '#8b93a3', 'center');
    await drawAvatar(ctx, l.p, lx + 44 + ad / 2, mid, ad);
    ctx.font = font(34, 700);
    text(ctx, fit(ctx, l.p.name, colG - 60 - (lx + 60 + ad), 34, 700, 22), lx + 60 + ad, mid + 1, +ctx.font.match(/(\d+)px/)[1], 700, T.text);
    text(ctx, String(l.goals), colG, mid + 2, vs, 800, '#fff', 'center');
    text(ctx, String(l.assists), colA, mid + 2, vs, 800, '#fff', 'center');
    drawRate(ctx, l.r, colN, mid, 128, Math.min(64, rh - 26), Math.min(40, rh * 0.42));
  }
  if (lines.length > rows.length) text(ctx, `+${lines.length - rows.length} jogadores`, rx, BOT + 4, 22, 600, T.muted, 'right', 'top');
  const g = lines.reduce((t, l) => t + l.goals, 0), a = lines.reduce((t, l) => t + l.assists, 0);
  cardFooter(ctx, `${plural(g, 'gol', 'gols')}  ·  ${plural(a, 'assistência', 'assistências')}  ·  ${plural(lines.length, 'jogador', 'jogadores')}`);
}

async function drawPlayerCard(ctx, d, pid) {
  const { n, lines } = roundInfo(d);
  const l = lines.find(x => x.player_id === pid);
  await cardBase(ctx, `Rodada ${n}`, fmtLong(d));
  // foto, nome e blocos: tudo centrado na mesma linha horizontal
  const midY = (TOP + BOT) / 2, D = BOT - TOP;
  await drawAvatar(ctx, l.p, M + D / 2, midY, D, 'rgba(55,77,245,.95)');
  const tx = M + D + 64, tw = CARD_W - M - tx;
  ctx.font = font(64, 800);
  text(ctx, fit(ctx, l.p.name, tw, 64, 800, 36), tx, TOP + 34, +ctx.font.match(/(\d+)px/)[1], 800, T.text);
  const gap = 24, sw = (tw - gap * 2) / 3, sy = TOP + 86, sh = BOT - sy, cy = sy + sh / 2 + 22;
  const blocks = [['GOLS', String(l.goals)], ['ASSIST.', String(l.assists)], ['NOTA', null]];
  for (let i = 0; i < 3; i++) {
    const bx = tx + i * (sw + gap), bc = bx + sw / 2;
    panel(ctx, bx, sy, sw, sh, 30, 'rgba(255,255,255,.05)');
    text(ctx, blocks[i][0], bc, sy + 44, 24, 800, T.muted, 'center', 'middle', 3);
    if (blocks[i][1] != null) text(ctx, blocks[i][1], bc, cy + 6, 170, 800, '#fff', 'center');
    else drawRate(ctx, l.r, bc, cy, Math.min(sw - 40, 250), 136, 96);
  }
  const s = aggregate().find(x => x.id === pid);
  cardFooter(ctx, s ? `Temporada: ${plural(s.g, 'gol', 'gols')} · ${plural(s.a, 'assistência', 'assistências')} · ${plural(s.j, 'jogo', 'jogos')}` : '');
}

const share = { date: null, kind: 'round', style: store.get('sofaquinta-card-style') === 'dark' ? 'dark' : 'clear', blob: null, url: null };
async function renderShareImage() {
  const img = $('#shimg'), btns = document.querySelectorAll('#shsheet [data-sh]');
  btns.forEach(b => b.disabled = true);
  img.style.opacity = .35;
  try {
    if (document.fonts) await Promise.all([document.fonts.load(font(40, 800)), document.fonts.load(font(40, 700)), document.fonts.load(font(40, 600))]).catch(() => {});
    const c = document.createElement('canvas'); c.width = CARD_W; c.height = CARD_H;
    const ctx = c.getContext('2d');
    T = THEMES[share.style];
    $('#shprev').classList.toggle('clear', share.style === 'clear');
    if (share.kind === 'me' && session) await drawPlayerCard(ctx, share.date, session.id);
    else await drawRoundCard(ctx, share.date);
    const blob = await new Promise(r => c.toBlob(r, 'image/png'));
    if (!blob) throw new Error('png');
    if (share.url) URL.revokeObjectURL(share.url);
    share.blob = blob; share.url = URL.createObjectURL(blob);
    img.src = share.url; img.style.opacity = 1;
    btns.forEach(b => b.disabled = false);
  } catch (e) { console.error(e); toast('Não consegui gerar a imagem', true); }
}
function shareName() {
  const { n } = roundInfo(share.date);
  return `sofaquinta-rodada-${n}${share.kind === 'me' && session ? '-' + norm(first(session.name)) : ''}${share.style === 'clear' ? '-transparente' : ''}-${share.date}.png`;
}
async function openShare(d) {
  share.date = d;
  const played = session && state.stats.some(s => s.player_id === session.id && s.match_date === d);
  if (!played) share.kind = 'round';
  const { n } = roundInfo(d);
  const canFiles = (() => { try { return !!(navigator.canShare && navigator.canShare({ files: [new File([new Blob()], 'x.png', { type: 'image/png' })] })); } catch { return false; } })();
  $('#shsheet').innerHTML = `
    <div class="grab"></div>
    <div class="shead"><div><h2>Resumo da rodada ${n}</h2><p>${fmtLong(d)}</p></div><button class="close" data-shclose aria-label="Fechar">✕</button></div>
    <div class="shbody">
      ${played ? `<div class="seg shseg"><button type="button" data-kind="round" class="${share.kind === 'round' ? 'on' : ''}">Rodada completa</button><button type="button" data-kind="me" class="${share.kind === 'me' ? 'on' : ''}">Meu card</button></div>` : ''}
      <div class="seg shseg"><button type="button" data-style="clear" class="${share.style === 'clear' ? 'on' : ''}">Transparente (Strava)</button><button type="button" data-style="dark" class="${share.style === 'dark' ? 'on' : ''}">Fundo escuro</button></div>
      <div class="shprev" id="shprev"><img id="shimg" alt="Prévia do card"></div>
      <div class="shbtns">
        ${canFiles ? '<button class="btn" data-sh="share" type="button">Compartilhar / Salvar na galeria</button>' : ''}
        <button class="btn ${canFiles ? 'alt' : ''}" data-sh="dl" type="button">Baixar PNG</button>
      </div>
    </div>`;
  lockScroll(true);
  animateIn($('#share'));
  renderShareImage();
}
function closeShare() {
  animateOut($('#share')).then(() => { if (!state.modalId && $('#confirm').hidden) lockScroll(false); });
}
document.addEventListener('click', ev => {
  const b = ev.target.closest('[data-share]'); if (!b) return;
  ev.preventDefault(); ev.stopPropagation();
  openShare(b.dataset.share);
});
$('#share').addEventListener('click', async ev => {
  if (ev.target === ev.currentTarget || ev.target.closest('[data-shclose]')) { closeShare(); return; }
  const k = ev.target.closest('[data-kind]');
  if (k && k.dataset.kind !== share.kind) {
    share.kind = k.dataset.kind;
    $('#shsheet').querySelectorAll('[data-kind]').forEach(x => x.classList.toggle('on', x === k));
    renderShareImage(); return;
  }
  const st = ev.target.closest('[data-style]');
  if (st && st.dataset.style !== share.style) {
    share.style = st.dataset.style; store.set('sofaquinta-card-style', share.style);
    $('#shsheet').querySelectorAll('[data-style]').forEach(x => x.classList.toggle('on', x === st));
    renderShareImage(); return;
  }
  const a = ev.target.closest('[data-sh]'); if (!a || !share.blob) return;
  if (a.dataset.sh === 'share') {
    const file = new File([share.blob], shareName(), { type: 'image/png' });
    try { await navigator.share({ files: [file], title: 'SofaQuinta' }); }
    catch (e) { if (e && e.name !== 'AbortError') toast('Não deu pra compartilhar. Use “Baixar PNG”.', true); }
  } else {
    const link = document.createElement('a');
    link.href = share.url; link.download = shareName();
    document.body.appendChild(link); link.click(); link.remove();
    toast('Imagem baixada!');
  }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !$('#share').hidden) closeShare(); });

/* ---------- início ---------- */
(function init() {
  setLive(true);
  form.date = lastThursday();
  $('#date').value = form.date;
  $('#date').max = iso(new Date());

  // entra sempre por uma aba válida; perfil aberto no link é reaberto depois de carregar
  const { tab, pid } = parseHash();
  history.replaceState({ app: 0 }, '', '#' + tab);
  showTab(tab);
  reload().then(() => { if (pid) openPlayer(pid); });

  if (sb) {
    let t;
    const again = () => { clearTimeout(t); t = setTimeout(reload, 350); };
    sb.channel('sofaquinta')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'stats' }, again)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'players' }, again)
      .subscribe();
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !busy) reload(); });
  window.addEventListener('online', () => reload());
  window.addEventListener('offline', () => setLive(false));
  // bloqueia pinça/zoom por gesto no iOS
  document.addEventListener('gesturestart', e => e.preventDefault());
})();
</script>
</body>
</html>
